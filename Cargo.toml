[workspace]
members = [
    "crates/supersearch-runtime",
    "src-tauri",
]
resolver = "2"

# Production release profile (applies workspace-wide). Cargo forces panic=unwind
# for test/bench artifacts, so these settings don't affect the test suite.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.dev]
# Keep line numbers for our own code's backtraces (1), but drop heavy variables (2)
debug = 1

[profile.dev.package."*"]
# Drop ALL debug symbols and lightly optimize dependencies (V8, Tauri)
# This stops the target/ folder from ballooning to 12GB+ while maintaining local DX.
debug = 0
opt-level = 1
