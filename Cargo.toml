[workspace]
members = [
    "crates/supersearch-runtime",
    "src-tauri",
]
resolver = "2"

# Production release profile (applies workspace-wide). Cargo forces panic=unwind
# for test/bench artifacts, so these settings don't affect the test suite.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.dev]
# Reduces the massive 12GB target/ folder by disabling heavy debug symbols
# for dependencies like V8/deno_core during local development.
debug = 0

# Optimize dependency compilation slightly without slowing down our own code iteration
[profile.dev.package."*"]
opt-level = 1
